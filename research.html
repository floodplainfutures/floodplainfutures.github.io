<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Seasonal Flood + Bird Patterns</title>
    <link rel="stylesheet" href="styles.css" />

    <link rel="stylesheet" href="timeline.css" />
    <script src="timeline.js" defer></script>
</head>

<body class="lightbackground">

  <main class="timeline-page">

    <header class="timeline-header">
        <a href="index.html" class="back-link">< back to home</a>
        <h1>recent birds @ the yolo basin</h1>
        <p>monthly averages · flood comparison</p>
    </header>

    <section class="timeline-visual">

    <div class="timeline-axis">
        <span>jan</span><span>feb</span><span>mar</span><span>apr</span>
        <span>may</span><span>jun</span><span>jul</span><span>aug</span>
        <span>sep</span><span>oct</span><span>nov</span><span>dec</span>
    </div>

    <div class="timeline-layer flood-layer">
        <svg class="wave-svg" viewBox="0 0 1200 120" preserveAspectRatio="none"></svg>
    </div>

    <div class="timeline-layer bird-layer aggregate">
        <svg class="wave-svg" viewBox="0 0 1200 120" preserveAspectRatio="none"></svg>
    </div>

    </section>

    <aside class="timeline-controls">
      <h2>species</h2>
      <ul class="species-list">
        <li data-species="sandhill-crane">sandhill crane</li>
        <li data-species="snow-goose">snow goose</li>
        <li data-species="white-pelican">white pelican</li>
      </ul>
    </aside>

  </main>

</body>
</html>
