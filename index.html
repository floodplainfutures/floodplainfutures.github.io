<script>
  (function () {
    var v = document.getElementById('myVideo');
    var cover = document.getElementById('videoCover');
    var loading = document.getElementById('loadingScreen');
    var landing = document.getElementById('landing');
    if (!v) return;

    function forcePlay() {
      v.muted = true;
      v.removeAttribute('controls');
      v.setAttribute('muted', '');
      
      var p = v.play();
      if (p !== undefined) {
        p.then(function() {
            if (cover) cover.style.opacity = '0';
        }).catch(function () {
          var events = ['touchstart', 'touchend', 'click', 'keydown', 'pointerdown'];
          function resume() {
            v.play().then(function() {
                if (cover) cover.style.opacity = '0';
            }).catch(function(){});
            events.forEach(function (ev) { document.removeEventListener(ev, resume); });
          }
          events.forEach(function (ev) { document.addEventListener(ev, resume, { once: true }); });
        });
      }
    }

    window.addEventListener('pageshow', function(e) {
        // If loaded from Safari's hardware/back-forward cache
        if (e.persisted || sessionStorage.getItem('hasVisited')) {
            if (loading) {
                loading.style.display = 'none'; // Directly force the overlay away
                loading.classList.add('hidden');
            }
            if (cover) {
                cover.style.opacity = '0';
            }
        }
        forcePlay();
    });
  })();
</script>
