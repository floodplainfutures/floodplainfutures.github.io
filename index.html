<body class="home-page">

    <!-- Loading Screen -->
    <div id="loadingScreen">
        <div id="loadingText">loading</div>
        <div id="loadingPercent">0%</div>
    </div>

    <!-- Video background -->
    <video id="myVideo" poster="images/formationflight.JPG" autoplay muted defaultMuted loop playsinline webkit-playsinline preload="auto">
        <source src="media/myVideo-fixed.mp4" type="video/mp4">
    </video>
    
    <div id="videoCover" style="background-image: url('images/formationflight.JPG');"></div>

    <div id="landing" class="state-intro">
        <div class="title-block">
            <h1><span class="spark"><span class="material-symbols-outlined">raven</span> </span>   Floodplain Futures</h1>
            <button id="beginBtn" class="begin-link">
                begin <span class="arrow">&#9758;</span>
            </button>
        </div>
        <nav class="menu">
            <!-- KIOSK MODE: links replaced with onclick. To restore, uncomment <a> tags and remove <span> tags below. -->
            <!-- <a href="context.html"      class="cAbout"><span class="material-symbols-outlined">info</span> context</a> -->
            <!-- <a href="map.html"          class="cMap"><span class="material-symbols-outlined">water_lux</span> the basin</a> -->
            <!-- <a href="systems.html"      class="cResearch"><span class="material-symbols-outlined">graph_2</span> systems</a> -->
            <!-- <a href="observations.html" class="cNotes"><span class="material-symbols-outlined">keep</span>observations</a> -->
            <span onclick="location.href='context.html'"      class="cAbout nav-btn"><span class="material-symbols-outlined">info</span> context</span>
            <span onclick="location.href='map.html'"          class="cMap nav-btn"><span class="material-symbols-outlined">water_lux</span> the basin</span>
            <span onclick="location.href='systems.html'"      class="cResearch nav-btn"><span class="material-symbols-outlined">graph_2</span> systems</span>
            <span onclick="location.href='observations.html'" class="cNotes nav-btn"><span class="material-symbols-outlined">keep</span>observations</span>
        </nav>
    </div>

    <script src="scripts.js" defer></script>
</body>
<script>
  (function () {
    var v = document.getElementById('myVideo');
    var cover = document.getElementById('videoCover');
    var loading = document.getElementById('loadingScreen');
    var landing = document.getElementById('landing');
    if (!v) return;

    function forcePlay() {
      v.muted = true;
      v.removeAttribute('controls');
      v.setAttribute('muted', '');
      
      var p = v.play();
      if (p !== undefined) {
        p.then(function() {
            if (cover) cover.style.opacity = '0';
        }).catch(function () {
          var events = ['touchstart', 'touchend', 'click', 'keydown', 'pointerdown'];
          function resume() {
            v.play().then(function() {
                if (cover) cover.style.opacity = '0';
            }).catch(function(){});
            events.forEach(function (ev) { document.removeEventListener(ev, resume); });
          }
          events.forEach(function (ev) { document.addEventListener(ev, resume, { once: true }); });
        });
      }
    }

    window.addEventListener('pageshow', function(e) {
        // If loaded from Safari's hardware/back-forward cache
        if (e.persisted || sessionStorage.getItem('hasVisited')) {
            if (loading) {
                loading.style.display = 'none'; // Directly force the overlay away
                loading.classList.add('hidden');
            }
            if (cover) {
                cover.style.opacity = '0';
            }
        }
        forcePlay();
    });
  })();
</script>
</html>
