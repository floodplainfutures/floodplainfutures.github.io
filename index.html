<script>
  (function () {
    var v = document.getElementById('myVideo');
    var cover = document.getElementById('videoCover');
    if (!v) return;

    function forcePlay() {
      v.muted = true;
      v.removeAttribute('controls');
      v.setAttribute('muted', '');
      
      // Ensure cover is visible while we negotiate with Safari
      if (cover) cover.style.opacity = '1';
      
      var p = v.play();
      if (p !== undefined) {
        // If play is successful (first load, or Safari allows it)
        p.then(function() {
            if (cover) cover.style.opacity = '0'; // Fade out cover!
        }).catch(function () {
          // BLOCKED: Safari forced a pause and showed the ugly button.
          // Because the cover is opacity: 1, the user cannot see the button.
          var events = ['touchstart', 'touchend', 'click', 'keydown', 'pointerdown'];
          
          function resume() {
            // User touched the screen! Play video, then hide cover.
            v.play().then(function() {
                if (cover) cover.style.opacity = '0';
            }).catch(function(){});
            
            // Clean up listeners
            events.forEach(function (ev) { 
                document.removeEventListener(ev, resume); 
            });
          }
          
          events.forEach(function (ev) {
            document.addEventListener(ev, resume, { once: true });
          });
        });
      }
    }

    // 1. Initial Load
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', forcePlay);
    } else {
      forcePlay();
    }
    
    // 2. Returning via Back Button
    window.addEventListener('pageshow', forcePlay);
    
    // 3. Returning from another Browser Tab
    document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
            forcePlay();
        }
    });

  })();
</script>
