<script>
  (function () {
    function tryPlay() {
      var v = document.getElementById('myVideo');
      if (!v) return;
      v.muted = true;
      v.setAttribute('muted', '');
      // Suppress controls at the DOM level too
      v.removeAttribute('controls');
      var p = v.play();
      if (p !== undefined) {
        p.catch(function () {
          // Safari blocked autoplay — silently resume on ANY first interaction.
          var events = ['touchstart', 'touchend', 'click', 'keydown', 'pointerdown'];
          function resume() {
            v.play().catch(function () {});
            events.forEach(function (ev) {
              document.removeEventListener(ev, resume);
            });
          }
          events.forEach(function (ev) {
            document.addEventListener(ev, resume, { once: true, passive: true });
          });
        });
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', tryPlay);
    } else {
      tryPlay();
    }
    window.addEventListener('load', tryPlay);
  })();
</script>
